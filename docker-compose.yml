services:
  postgres:
    image: postgres:16-alpine
    container_name: ordering-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ordering_system}
      POSTGRES_USER: ${DB_USERNAME:-ordering_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ordering_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ordering_user} -d ${DB_NAME:-ordering_system}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
