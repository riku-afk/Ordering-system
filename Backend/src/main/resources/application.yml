spring:
  # Explicitly import Backend/.env (relative to wherever the JVM is started
  # from) as a property source, instead of relying on Spring Boot's implicit
  # .env auto-detection - that behavior is undocumented enough across
  # versions/launch methods to be worth pinning down explicitly.
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: ordering-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ordering_system}
    username: ${DB_USERNAME:ordering_user}
    password: ${DB_PASSWORD:ordering_password}

  jpa:
    hibernate:
      # Schema is managed by Flyway migrations, not Hibernate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-your-env-it-must-be-at-least-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.example.ordering: INFO
